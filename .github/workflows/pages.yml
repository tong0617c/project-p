name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve empty optional base override
        run: |
          if [ -z "$PAGES_BASE_PATH" ]; then
            unset PAGES_BASE_PATH
          fi
          node --input-type=module -e "import { pagesBase } from './scripts/pages-base.mjs'; console.log('PAGES_BASE_PATH=' + pagesBase())" >> "$GITHUB_ENV"
      - name: TypeScript and unit tests
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run test:pages-base
      - name: Production build
        run: pnpm build
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Pages subpath and offline smoke test
        run: pnpm run test:pages
      - name: Upload website only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy approved website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
